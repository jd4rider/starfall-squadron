name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (combat, missions, saves)
        run: npm test
      - name: Validate all 300 campaign missions
        run: npm run check:missions
      - name: Type-check and build
        run: npm run build
      - name: Stage under /play/
        run: |
          mkdir -p site/play
          cp -r dist/. site/play/
          cp public/arcade-client.js site/play/arcade-client.js
          printf '<!doctype html><meta charset="utf-8"><title>Starfall Squadron</title><meta http-equiv="refresh" content="0;url=./play/"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#04060f;color:#eaf3ff;font-family:system-ui;display:grid;place-items:center;height:100vh}a{color:#4de1ff}</style><a href="./play/">Launch Starfall Squadron</a>' > site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
